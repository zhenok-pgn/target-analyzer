
# Alembic configuration file
# Target Analyzer

[alembic]

# Каталог миграций относительно расположения alembic.ini
script_location = %(here)s/migrations

# Добавляем backend в Python path
prepend_sys_path = %(here)s

# Разделитель путей для нескольких каталогов версий
version_path_separator = os

# Кодировка файлов миграций
output_encoding = utf-8

# URL базы данных устанавливается через env.py
# и переменную окружения DATABASE_URL.
sqlalchemy.url =


[post_write_hooks]


# Logging configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
